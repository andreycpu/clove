name: Clove
options:
  bundleIdPrefix: com.clove
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES

targets:
  Clove:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSPasteboardUsageDescription: Clove monitors your clipboard to save copied items.
        NSDesktopFolderUsageDescription: Clove watches your Desktop to automatically save screenshots.
        NSDownloadsFolderUsageDescription: Clove watches your Downloads folder to automatically save new files.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clove.app
        PRODUCT_NAME: Clove
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

configs:
  Debug: debug
  Release: release
